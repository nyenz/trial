<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squid — Natural Swim</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#04202f; }
  canvas { display:block; }
  #panel {
    position:fixed; top:18px; left:18px; z-index:10;
    color:#cfe9f5; font-family:"Segoe UI",system-ui,sans-serif;
    background:rgba(4,28,44,.55); border:1px solid rgba(120,200,235,.18);

  #panel h1 { font-size:15px; letter-spacing:3px; font-weight:600; color:#8fd4f2; }

<body>
<div id="panel">
  <h1>🦑 SQUID</h1>
  <p>natural mantle pulse · fin undulation · gentle swimming<br>
  jet propulsion · synchronized body motion · organic waves</p>
</div>
<div id="hint">drag — orbit &nbsp;·&nbsp; wheel / pinch — zoom &nbsp;·&nbsp; click / space — jet burst</div>
<div id="err"></div>
<div id="vig"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>if(!window.THREE)document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>

<script>
(function(){
'use strict';
function showErr(msg){
  var d=document.getElementById('err');
  d.style.display='block'; d.textContent='⚠ '+msg;
}
window.addEventListener('error',function(e){ showErr(e.message+'  (line '+(e.lineno||'?')+')'); },true);

if(!window.THREE){ showErr('Three.js could not be loaded from any CDN. Check your internet connection and reload.'); return; }

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ============================== RENDERER / SCENE ============================== */
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true}); }
catch(e){ showErr('WebGL not available on this device: '+e.message); return; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x06304c,0.019);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,400);

scene.add(new THREE.HemisphereLight(0x9fd8ef,0x0a2030,0.85));
const sun=new THREE.DirectionalLight(0xbfe9ff,1.05); sun.position.set(6,24,8); scene.add(sun);
const fill=new THREE.PointLight(0x4a90b8,0.55,45); scene.add(fill);

/* background gradient dome */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(180,24,16),
  new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y*0.5+0.5;vec3 deep=vec3(0.008,0.045,0.085);vec3 mid=vec3(0.024,0.16,0.29);vec3 top=vec3(0.10,0.40,0.55);vec3 c=mix(deep,mid,smoothstep(0.0,0.55,h));c=mix(c,top,smoothstep(0.55,1.0,h));gl_FragColor=vec4(c,1.0);}'
  })));

/* ============================== TEXTURES ============================== */
function skinTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.fillStyle='#c2573b'; g.fillRect(0,0,256,256);
  const cols=['#8f2f1f','#a33a24','#d97a4a','#7c2718','#b34a2c'];
  for(let i=0;i<1100;i++){
    g.globalAlpha=0.05+Math.random()*0.22;
    g.fillStyle=cols[(Math.random()*cols.length)|0];
    g.beginPath(); g.arc(Math.random()*256,Math.random()*256,0.8+Math.random()*3.4,0,7); g.fill();
  }
  g.globalAlpha=0.25; g.fillStyle='#f0a06a';
  for(let i=0;i<90;i++){ g.beginPath(); g.arc(Math.random()*256,Math.random()*256,0.7+Math.random()*1.2,0,7); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function dotTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,0.6)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
function bubbleTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.9)'; g.lineWidth=3;
  g.beginPath(); g.arc(32,32,24,0,7); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.35)'; g.lineWidth=7;
  g.beginPath(); g.arc(32,32,24,0,7); g.stroke();
  g.fillStyle='rgba(255,255,255,0.95)';
  g.beginPath(); g.arc(22,20,4,0,7); g.fill();
  return new THREE.CanvasTexture(c);
}
function rayTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=256;
  const g=c.getContext('2d');
  const v=g.createLinearGradient(0,0,0,256);
  v.addColorStop(0,'rgba(255,255,255,0.9)'); v.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=v; g.fillRect(0,0,128,256);
  const h=g.createLinearGradient(0,0,128,0);
  h.addColorStop(0,'rgba(0,0,0,0)'); h.addColorStop(0.5,'rgba(0,0,0,1)'); h.addColorStop(1,'rgba(0,0,0,0)');
  g.globalCompositeOperation='destination-in'; g.fillStyle=h; g.fillRect(0,0,128,256);
  return new THREE.CanvasTexture(c);
}

/* ============================== MATERIALS ============================== */
const skinTex=skinTexture();
const bodyMat =new THREE.MeshPhongMaterial({map:skinTex,color:0xffffff,shininess:42,specular:0x552b22,emissive:0x180605,side:THREE.DoubleSide});
const armMat  =new THREE.MeshPhongMaterial({map:skinTex,color:0xf2d9cc,shininess:38,specular:0x44221c,emissive:0x150504,side:THREE.DoubleSide});
const tentMat =new THREE.MeshPhongMaterial({map:skinTex,color:0xf7e2d6,shininess:40,specular:0x44221c,emissive:0x150504,side:THREE.DoubleSide});
const finMat  =new THREE.MeshPhongMaterial({map:skinTex,color:0xf3c8b4,shininess:30,specular:0x332020,emissive:0x120404,side:THREE.DoubleSide,transparent:true,opacity:0.94});
const eyeMat  =new THREE.MeshPhongMaterial({color:0xd7ded2,shininess:90,specular:0xffffff});
const pupilMat=new THREE.MeshPhongMaterial({color:0x0c1013,shininess:120,specular:0x667788});
const specMat =new THREE.MeshBasicMaterial({color:0xffffff});

/* ============================== SQUID MODEL ============================== */
const squid=new THREE.Group();
const bodyG=new THREE.Group();
squid.add(bodyG); scene.add(squid);

/* MANTLE - Main body with natural contraction wave */
const M_LO=3.6, M_Z0=-1.4;
let mantleMesh, mantleBase;

function mantleR(t){
  /* Base mantle radius profile - tapered cone shape */
  if(t<0.18) return lerp(0.82,1.0,smooth(0,0.18,t));
  const u=(t-0.18)/0.82;
  return Math.pow(Math.cos(u*Math.PI/2),1.12)+0.001;
}

(function buildMantle(){
  const pts=[];
  for(let i=0;i<=30;i++){ 
    const t=i/30; 
    pts.push(new THREE.Vector2(mantleR(t), M_Z0+t*M_LO)); 
  }
  const g=new THREE.LatheGeometry(pts,36); 
  g.rotateX(Math.PI/2);
  mantleMesh=new THREE.Mesh(g,bodyMat);
  mantleBase=Float32Array.from(mantleMesh.geometry.attributes.position.array);
  bodyG.add(mantleMesh);
})();

/* FINS - Bilateral fins with traveling wave */
const fins=[];
function buildFin(side){
  const LS=26, WS=10, geo=new THREE.BufferGeometry();
  const vc=(LS+1)*(WS+1);
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(vc*3),3));
  const uv=new Float32Array(vc*2); let k=0;
  for(let i=0;i<=LS;i++)for(let j=0;j<=WS;j++){ uv[k++]=i/LS*2; uv[k++]=j/WS; }
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  const idx=[];
  for(let i=0;i<LS;i++)for(let j=0;j<WS;j++){
    const a=i*(WS+1)+j, b=a+WS+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  geo.setIndex(idx);
  const m=new THREE.Mesh(geo,finMat); 
  m.frustumCulled=false;
  m.userData={side,LS,WS};
  bodyG.add(m); 
  fins.push(m);
}
buildFin(1); 
buildFin(-1);

/* HEAD */
const head=new THREE.Mesh(new THREE.SphereGeometry(0.80,28,20),bodyMat);
head.position.set(0,0,-1.82); 
head.scale.set(1,0.95,1.05); 
bodyG.add(head);

/* EYES */
const pupils=[];
[-1,1].forEach(side=>{
  const g=new THREE.Group(); 
  g.position.set(side*0.55,0.05,-1.82);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.33,24,18),eyeMat);
  const pupil=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),pupilMat);
  pupil.position.set(side*0.24,0.02,0.03); 
  pupil.scale.set(0.55,1,1);
  const spec=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,8),specMat);
  spec.position.set(side*0.30,0.10,0.08);
  g.add(ball,pupil,spec); 
  bodyG.add(g); 
  pupils.push({p:pupil,side});
});

/* SIPHON */
const siphon=new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.17,0.55,12),armMat);
siphon.position.set(0,-0.62,-1.60); 
siphon.rotation.x=-2.03; 
bodyG.add(siphon);
const jetMouth=new THREE.Object3D(); 
jetMouth.position.set(0,0.30,0); 
siphon.add(jetMouth);
const JET_DIR_LOCAL=new THREE.Vector3(0,-0.45,-0.89).normalize();

/* ARMS */
function makeTentacle(o){
  const segs=o.segs, rad=o.radial, geo=new THREE.BufferGeometry();
  const vc=(segs+1)*(rad+1);
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(vc*3),3));
  const uv=new Float32Array(vc*2); let k=0;
  for(let i=0;i<=segs;i++)for(let j=0;j<=rad;j++){ uv[k++]=i/segs*3; uv[k++]=j/rad; }
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  const idx=[];
  for(let i=0;i<segs;i++)for(let j=0;j<rad;j++){
    const a=i*(rad+1)+j, b=a+rad+1;
    idx.push(a,b,a+1, b,b+1,a+1);
  }
  geo.setIndex(idx);
  const mesh=new THREE.Mesh(geo,o.feeding?tentMat:armMat);
  mesh.frustumCulled=false;
  const d0=o.dir.clone().normalize();
  const h=Math.abs(d0.y)>0.92?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
  const nA=new THREE.Vector3().crossVectors(d0,h).normalize();
  const nB=new THREE.Vector3().crossVectors(d0,nA).normalize();
  const cosT=[],sinT=[];
  for(let j=0;j<=rad;j++){ const th=j/rad*Math.PI*2; cosT.push(Math.cos(th)); sinT.push(Math.sin(th)); }
  const pts=[]; for(let i=0;i<=segs;i++) pts.push(new THREE.Vector3());
  const strikeDir=d0.clone().multiplyScalar(0.2).add(new THREE.Vector3(0,-0.3,-1)).normalize();
  mesh.userData={o,d0,nA,nB,cosT,sinT,pts,strikeDir};
  bodyG.add(mesh);
  return mesh;
}

const arms=[];
for(let k=0;k<8;k++){
  const th=k*Math.PI/4+Math.PI/8;
  const c=Math.cos(th), s=Math.sin(th);
  arms.push(makeTentacle({
    base:new THREE.Vector3(0.42*c,0.42*s,-2.25),
    dir:new THREE.Vector3(0.34*c,0.34*s,-1),
    len:2.6+0.5*Math.abs(Math.sin(th*2.1)), rBase:0.155, rTip:0.015,
    segs:22, radial:7, phase:k*1.7, amp:1, feeding:false
  }));
}

const tentacles=[];
[-0.42,0.42].forEach((off,i)=>{
  const c=Math.sin(off), s=-Math.cos(off);
  tentacles.push(makeTentacle({
    base:new THREE.Vector3(0.30*c,0.30*s,-2.30),
    dir:new THREE.Vector3(0.22*c,0.22*s,-1),
    len:3.9, rBase:0.085, rTip:0.02,
    segs:28, radial:7, phase:2.6+i*2.2, amp:0.85, feeding:true
  }));
});
const strikes=[{next:3.5,t:-9,env:0},{next:7.5,t:-9,env:0}];

/* ============================== JET ENGINE ============================== */
const jet={phase0:0,period:2.8,burstT:-9,thrust:0,speed:1.4,cTot:0};

/* Contraction shape function - smooth pulse with quick contraction, slow relaxation */
function cShape(p){ 
  p=((p%1)+1)%1; 
  if(p>=0.5)return 0; 
  const s=Math.sin(Math.PI*p/0.5); 
  return s*s*s; 
}

/* Contraction at time t, position zn along mantle (0=head, 1=tail) */
function cAt(time,zn){
  /* Base rhythmic pulse traveling from head to tail */
  let v=cShape(((time-jet.phase0)/jet.period)-zn*0.07);
  /* Burst override - stronger pulse triggered by user */
  const bt=(time-jet.burstT)-zn*0.18;
  if(bt>0&&bt<0.5){ 
    const s=Math.sin(Math.PI*bt/0.5); 
    v=Math.max(v,s*s); 
  }
  return v;
}

function triggerBurst(now){ 
  jet.burstT=now; 
  jet.phase0=now-0.05*jet.period; 
  spawnSplash();
}

/* ============================== SWIM PATH ============================== */
let pathAngle=0, bank=0;
const pos=new THREE.Vector3(), posAhead=new THREE.Vector3(),
      velDir=new THREE.Vector3(0,0,1), prevDir=new THREE.Vector3(0,0,1),
      targetQ=new THREE.Quaternion(), tmpM=new THREE.Matrix4(),
      tmpV=new THREE.Vector3(), tmpV2=new THREE.Vector3(),
      ZERO=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0);

function pathPos(a,out){
  const r=10+2.4*Math.sin(a*2.0+0.7);
  out.set(r*Math.cos(a), 1.4*Math.sin(a*1.6)+0.8*Math.sin(a*0.5+2), r*Math.sin(a));
}

/* ============================== PARTICLES ============================== */
const SNOW=550, snowGeo=new THREE.BufferGeometry();
const snowArr=new Float32Array(SNOW*3);
for(let i=0;i<SNOW;i++){
  snowArr[i*3]=(Math.random()-0.5)*50;
  snowArr[i*3+1]=(Math.random()-0.5)*36;
  snowArr[i*3+2]=(Math.random()-0.5)*50;
}
snowGeo.setAttribute('position',new THREE.BufferAttribute(snowArr,3));
scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({
  size:0.09,map:dotTexture(),transparent:true,opacity:0.45,
  color:0xaed4e6,depthWrite:false})));

const NB=260, bubGeo=new THREE.BufferGeometry();
const bubArr=new Float32Array(NB*3).fill(9999);
bubGeo.setAttribute('position',new THREE.BufferAttribute(bubArr,3));
const bubbles=[]; for(let i=0;i<NB;i++) bubbles.push({life:0,vel:new THREE.Vector3()});
scene.add(new THREE.Points(bubGeo,new THREE.PointsMaterial({
  size:0.30,map:bubbleTexture(),transparent:true,opacity:0.75,
  color:0xd8f2ff,depthWrite:false})));
let bubIdx=0;

function spawnBubble(p,v){
  const b=bubbles[bubIdx]; bubIdx=(bubIdx+1)%NB;
  b.life=1.4+Math.random()*1.2; b.vel.copy(v);
  bubArr[bubIdx*3]=p.x; bubArr[bubIdx*3+1]=p.y; bubArr[bubIdx*3+2]=p.z;
}

function spawnSplash(){
  for(let i=0;i<18;i++){
    tmpV.set((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2);
    tmpV2.copy(tmpV).multiplyScalar(0.8).add(new THREE.Vector3(0,0,-3)).applyQuaternion(squid.quaternion);
    spawnBubble(squid.position,tmpV2);
  }
}

/* god rays */
const rays=new THREE.Group(); scene.add(rays);
const rayMeshes=[];
(function(){
  const tex=rayTexture();
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(3.5+Math.random()*5,46),
      new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.05+Math.random()*0.05,
        blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    m.position.set((Math.random()-0.5)*36,18,(Math.random()-0.5)*36);
    m.rotation.y=Math.random()*Math.PI;
    rays.add(m); rayMeshes.push(m);
  }
})();

/* ============================== CAMERA CONTROL ============================== */
const cam={theta:0,phi:0.42,dist:10.5,target:new THREE.Vector3(),lastInput:-9};
const pointers=new Map(); let dragDist=0,downTime=0,pinchDist=0;
const el=renderer.domElement;
el.style.touchAction='none';

el.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragDist=0; downTime=performance.now();
  try{ el.setPointerCapture(e.pointerId); }catch(_){}
});

el.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const p=pointers.get(e.pointerId);
  if(pointers.size===1){
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    cam.theta-=dx*0.005; cam.phi=clamp(cam.phi+dy*0.004,0.06,1.35);
    dragDist+=Math.abs(dx)+Math.abs(dy);
    cam.lastInput=clockT;
  }
  p.x=e.clientX; p.y=e.clientY;
  if(pointers.size===2){
    const pts=[...pointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(pinchDist>0) cam.dist=clamp(cam.dist*pinchDist/d,5.5,26);
    pinchDist=d;
  }
});

function endPointer(e){
  if(pointers.size===1 && dragDist<7 && performance.now()-downTime<400) triggerBurst(clockT);
  pointers.delete(e.pointerId); pinchDist=0;
}
el.addEventListener('pointerup',endPointer);
el.addEventListener('pointercancel',endPointer);
el.addEventListener('wheel',e=>{ e.preventDefault();
  cam.dist=clamp(cam.dist*(1+e.deltaY*0.0012),5.5,26); cam.lastInput=clockT; },{passive:false});
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); triggerBurst(clockT);} });

/* ============================== PER-FRAME UPDATERS ============================== */
const _dir=new THREE.Vector3(),_N=new THREE.Vector3(),_B=new THREE.Vector3(),
      _T=new THREE.Vector3(),_ref=new THREE.Vector3(),_back=new THREE.Vector3();

/* Update tentacle/arm mesh vertices */
function updateTentacle(mesh,t,thrust,strike){
  const u=mesh.userData, o=u.o, segs=o.segs, rad=o.radial;
  _back.set(0,-0.08,-1).normalize();
  _dir.copy(u.d0).lerp(_back,0.55*thrust).normalize();
  const step=o.len*(1+(o.feeding?0.95*strike:0))/segs;
  const wa=o.amp*(1-0.75*thrust)*(1-0.8*strike);
  u.pts[0].copy(o.base);
  for(let i=1;i<=segs;i++){
    const tt=i/segs;
    const aA=Math.sin(t*2.3+o.phase-tt*4.6)*0.5*wa*(0.25+0.75*tt);
    const aB=Math.cos(t*1.8+o.phase*1.6-tt*3.4)*0.42*wa*(0.2+0.8*tt);
    tmpV.copy(_dir).addScaledVector(u.nA,aA).addScaledVector(u.nB,aB);
    if(o.feeding&&strike>0) tmpV.lerp(u.strikeDir,strike*0.85);
    tmpV.normalize();
    u.pts[i].copy(u.pts[i-1]).addScaledVector(tmpV,step);
  }
  const posA=mesh.geometry.attributes.position.array; let p=0;
  for(let i=0;i<=segs;i++){
    const tt=i/segs;
    if(i===0)_T.subVectors(u.pts[1],u.pts[0]);
    else if(i===segs)_T.subVectors(u.pts[segs],u.pts[segs-1]);
    else _T.subVectors(u.pts[i+1],u.pts[i-1]);
    _T.normalize();
    _ref.copy(Math.abs(_T.dot(u.nA))<0.9?u.nA:u.nB);
    _N.crossVectors(_T,_ref).normalize();
    _B.crossVectors(_T,_N).normalize();
    let r=o.rBase+(o.rTip-o.rBase)*Math.pow(tt,0.85);
    if(o.feeding) r+=Math.exp(-Math.pow((tt-0.93)/0.085,2))*0.075*(1+0.6*strike);
    for(let j=0;j<=rad;j++){
      posA[p++]=u.pts[i].x+(_N.x*u.cosT[j]+_B.x*u.sinT[j])*r;
      posA[p++]=u.pts[i].y+(_N.y*u.cosT[j]+_B.y*u.sinT[j])*r;
      posA[p++]=u.pts[i].z+(_N.z*u.cosT[j]+_B.z*u.sinT[j])*r;
    }
  }
  mesh.geometry.attributes.position.needsUpdate=true;
  mesh.geometry.computeVertexNormals();
}

/* Update mantle with contraction wave */
function updateMantle(t){
  const posA=mantleMesh.geometry.attributes.position;
  for(let i=0;i<posA.count;i++){
    const x=mantleBase[i*3], y=mantleBase[i*3+1], z=mantleBase[i*3+2];
    const zn=(z-M_Z0)/M_LO, c=cAt(t,zn);
    /* Radial contraction + slight elongation during pulse */
    const s=1-0.16*c;
    posA.setXYZ(i,x*s,y*s,z*(1+0.05*c));
  }
  posA.needsUpdate=true;
  mantleMesh.geometry.computeVertexNormals();
}

/* Update fins with traveling wave synchronized to mantle */
function updateFins(t,thrust){
  for(const f of fins){
    const {side,LS,WS}=f.userData, posA=f.geometry.attributes.position;
    /* Fin activity reduces when jet thrust is high - energy conservation */
    const drive=1-thrust*0.55;
    let k=0;
    for(let i=0;i<=LS;i++){
      const s=i/LS, z=lerp(1.9,0.15,s);
      const zn=clamp((z-M_Z0)/M_LO,0,1);
      const rM=mantleR(zn)*(1-0.16*cAt(t,zn));
      const rx=side*0.77*rM, ry=0.64*rM;
      const w=1.55*Math.sin(Math.PI*Math.pow(s,0.8));
      for(let j=0;j<=WS;j++){
        const uu=j/WS;
        /* Traveling sinusoidal wave along fin length */
        const wave=Math.sin(s*6.5-t*6.2)*0.38*uu*(0.35+0.65*drive);
        const sweep=-uu*w*(0.45+0.55*thrust);
        posA.setXYZ(k++, rx+side*uu*w*0.98, ry+uu*w*0.28+wave, z+sweep);
      }
    }
    posA.needsUpdate=true;
    f.geometry.computeVertexNormals();
  }
}

/* ============================== MAIN LOOP ============================== */
const clock=new THREE.Clock(); let clockT=0;
const flashCol=new THREE.Color(), whiteCol=new THREE.Color(0xffffff),
      armBaseCol=new THREE.Color(0xf2d9cc), tentBaseCol=new THREE.Color(0xf7e2d6),
      finBaseCol=new THREE.Color(0xf3c8b4);

function animate(){
  requestAnimationFrame(animate);
  const dt=clamp(clock.getDelta(),0.001,0.05); clockT=clock.elapsedTime;
  const t=clockT;

  /* === JET PROPULSION SYSTEM === */
  const raw=Math.min(1,cAt(t,0.25));
  const kS=raw>jet.thrust?1-Math.exp(-dt*14):1-Math.exp(-dt*3);
  jet.thrust+=(raw-jet.thrust)*kS;
  jet.cTot=raw;
  jet.speed=1.4+5.2*jet.thrust;

  /* === MOVEMENT ALONG PATH === */
  prevDir.copy(velDir);
  pathAngle+=jet.speed*dt/11;
  pathPos(pathAngle,pos); pathPos(pathAngle+0.02,posAhead);
  velDir.subVectors(posAhead,pos).normalize();
  if(velDir.lengthSq()<1e-8) velDir.set(0,0,1);
  squid.position.copy(pos);
  
  /* Orientation: nose (+Z) points along travel direction */
  tmpM.lookAt(velDir,ZERO,UP);
  targetQ.setFromRotationMatrix(tmpM);
  squid.quaternion.slerp(targetQ,1-Math.exp(-3.5*dt));
  
  /* Banking during turns */
  tmpV.crossVectors(prevDir,velDir);
  bank+=(clamp(tmpV.y/dt*0.35,-0.45,0.45)-bank)*Math.min(1,dt*2.5);

  /* === BODY ANIMATION === */
  /* Gentle bobbing + mantle contraction effect on body group */
  bodyG.position.set(0, 0.05*Math.sin(t*1.3), -0.20*jet.cTot);
  bodyG.rotation.set(0.04*Math.sin(t*1.1)-0.06*jet.cTot, 0, bank);

  /* === UPDATE ALL PARTS === */
  updateMantle(t);
  updateFins(t,jet.thrust);
  arms.forEach(a=>updateTentacle(a,t,jet.thrust,0));
  strikes.forEach((st,i)=>{
    if(t>st.next){ st.t=t; st.next=t+5+Math.random()*6; }
    const uu=t-st.t;
    st.env = uu<0?0 : uu<0.12?smooth(0,0.12,uu) : uu<0.32?1 : uu<0.9?1-smooth(0.32,0.9,uu):0;
    updateTentacle(tentacles[i],t,jet.thrust,st.env);
  });

  /* Eye micro-movements */
  pupils.forEach(e=>{
    e.p.position.set(e.side*(0.24+0.025*Math.sin(t*0.8+e.side)),
                     0.02+0.02*Math.sin(t*0.63+e.side*2),
                     0.03+0.03*Math.sin(t*0.5));
  });

  /* Siphon scales with thrust */
  const sp=1+0.35*jet.thrust; siphon.scale.set(sp,1,sp);
  
  /* Spawn jet bubbles during contraction */
  if(jet.cTot>0.25){
    jetMouth.getWorldPosition(tmpV);
    const n=Math.ceil(jet.cTot*5);
    for(let i=0;i<n;i++){
      tmpV2.copy(JET_DIR_LOCAL).applyQuaternion(squid.quaternion)
        .multiplyScalar(3+3.5*jet.cTot)
        .addScaledVector(velDir,jet.speed*0.55);
      tmpV2.x+=(Math.random()-0.5)*0.7; tmpV2.y+=(Math.random()-0.5)*0.7; tmpV2.z+=(Math.random()-0.5)*0.7;
      spawnBubble(tmpV,tmpV2);
    }
  }

  /* Update bubbles */
  for(let i=0;i<NB;i++){
    const b=bubbles[i]; if(b.life<=0)continue;
    b.life-=dt;
    if(b.life<=0){ bubArr[i*3+1]=9999; continue; }
    b.vel.y+=1.1*dt; b.vel.multiplyScalar(Math.max(0,1-1.5*dt));
    bubArr[i*3]+=b.vel.x*dt; bubArr[i*3+1]+=b.vel.y*dt; bubArr[i*3+2]+=b.vel.z*dt;
  }
  bubGeo.attributes.position.needsUpdate=true;

  /* Update ambient particles */
  for(let i=0;i<SNOW;i++){
    let x=snowArr[i*3],y=snowArr[i*3+1],z=snowArr[i*3+2];
    if(x-pos.x<-25)x+=50; if(x-pos.x>25)x-=50;
    if(y-pos.y<-18)y+=36; if(y-pos.y>18)y-=36;
    if(z-pos.z<-25)z+=50; if(z-pos.z>25)z-=50;
    snowArr[i*3]=x; snowArr[i*3+1]=y-0.12*dt; snowArr[i*3+2]=z;
  }
  snowGeo.attributes.position.needsUpdate=true;

  /* God rays follow squid */
  rays.position.lerp(tmpV.set(pos.x,0,pos.z),1-Math.exp(-dt*2));
  rayMeshes.forEach((m,i)=>{ m.rotation.y+=dt*0.02*(i%2?1:-1);
    m.material.opacity=(0.05+0.03*Math.sin(t*0.3+i*2))*clamp(1.2-Math.abs(m.position.y-16)*0.02,0.4,1); });

  /* Color flash during jet thrust */
  flashCol.setRGB(1,0.85,0.72);
  bodyMat.color.copy(whiteCol).lerp(flashCol,jet.thrust*0.7);
  bodyMat.emissive.setRGB(0.09+jet.thrust*0.12,0.02,0.02);
  armMat.color.copy(armBaseCol).lerp(flashCol,jet.thrust*0.5);
  tentMat.color.copy(tentBaseCol).lerp(flashCol,jet.thrust*0.5);
  finMat.color.copy(finBaseCol).lerp(flashCol,jet.thrust*0.5);

  fill.position.copy(pos).add(tmpV.set(0,3,2));

  /* Auto-orbit when idle */
  if(t-cam.lastInput>4) cam.theta+=dt*0.04;
  cam.target.lerp(pos,1-Math.exp(-dt*2.5));
  camera.position.set(
    cam.target.x+cam.dist*Math.cos(cam.phi)*Math.sin(cam.theta),
    cam.target.y+cam.dist*Math.sin(cam.phi),
    cam.target.z+cam.dist*Math.cos(cam.phi)*Math.cos(cam.theta));
  camera.lookAt(cam.target);

  renderer.render(scene,camera);
}

/* Initial setup */
pathPos(0,pos); pathPos(0.02,posAhead);
velDir.subVectors(posAhead,pos).normalize();
squid.position.copy(pos);
squid.quaternion.setFromRotationMatrix(tmpM.lookAt(velDir,ZERO,UP));
cam.theta=Math.atan2(-velDir.x,-velDir.z);
cam.target.copy(pos);
camera.position.set(
  cam.target.x+cam.dist*Math.cos(cam.phi)*Math.sin(cam.theta),
  cam.target.y+cam.dist*Math.sin(cam.phi),
  cam.target.z+cam.dist*Math.cos(cam.phi)*Math.cos(cam.theta));
camera.lookAt(cam.target);
fill.position.copy(pos);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
})();
</script>
