<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Squid Ocean Viewer - Animated</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: linear-gradient(180deg, #001a33 0%, #003366 50%, #004d99 100%);
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #aaccff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0, 20, 40, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #aaccff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background: rgba(0, 20, 40, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
        }
        #controls label {
            display: block;
            margin: 5px 0;
        }
        #controls input[type="range"] {
            width: 150px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <strong>🦑 Animated Squid</strong><br>
        Swimming through the ocean depths...
    </div>
    <div id="controls">
        <label>Swim Speed: <input type="range" id="speedSlider" min="0" max="2" step="0.1" value="0.5"></label>
        <label>Animation Intensity: <input type="range" id="intensitySlider" min="0.1" max="2" step="0.1" value="1"></label>
        <label><input type="checkbox" id="autoRotate" checked> Auto Camera</label>
    </div>
    <script type="module" src="squid_viewer_animated.js"></script>
</body>
</html>
